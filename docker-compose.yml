version: '3.8'

services:
  tux-server:
    image: ghcr.io/devendev-team/tux-server:latest
    build:
      context: ./tux-server
    container_name: tux-sync-server
    ports:
      - "8282:8282"
    environment:
      # Mot de passe d'accès au panneau d'administration (/admin)
      - ADMIN_PASSWORD=mon_mot_de_passe_admin_1234
    volumes:
      # Persister le dossier de données contenant la base SQLite
      - ./tux-server/data:/app/data
      # Monter le code de la PWA mobile pour qu'il soit servi à la racine par le serveur
      - ./tux-mobile:/app/tux-mobile
    restart: unless-stopped
